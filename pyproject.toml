[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-webui"
version = "1.0.0"
description = "Modern Developer Web UI and Multi-Channel Gateway for Google Antigravity (agy)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "discord.py>=2.3.2",
]

[project.scripts]
agy-webui = "app.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["*"]
